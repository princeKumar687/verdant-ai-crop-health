<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verdant AI | Admin Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eaf2e8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .login-box {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 8px 30px #00000015;
        }
        h2 { color: #1c4932; text-align: center; }
        p { color: #718071; text-align: center; }
        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            background: #1c4932;
            color: white;
            border: 0;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🌿 Verdant AI</h2>
        <p>Administrator Login</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
            <input type="text" name="username"
                   placeholder="Admin Username" required>

            <input type="password" name="password"
                   placeholder="Admin Password" required>

            <button type="submit">Login to Dashboard</button>
        </form>
    </div>
</body>
</html>
